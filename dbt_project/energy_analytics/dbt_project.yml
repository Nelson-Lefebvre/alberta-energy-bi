name: 'energy_analytics'
version: '1.0.0'
config-version: 2

profile: 'energy_analytics'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  energy_analytics:
    # Schémas Unity Catalog pris tels quels grâce à macros/generate_schema_name.sql
    staging:
      +materialized: view
      +schema: alberta_silver
    marts:
      +materialized: table
      +schema: alberta_gold
